name: ZenData CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite (FastAPI & Pandas)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: zendataproject/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit & integration tests
        working-directory: zendataproject/backend
        run: |
          python -m unittest discover -s tests -v

  frontend-build:
    name: Frontend Build Verification (Next.js & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: zendataproject/frontend/package.json

      - name: Install dependencies
        working-directory: zendataproject/frontend
        run: npm ci || npm install

      - name: Run Next.js production build
        working-directory: zendataproject/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://zendata-backend.onrender.com
