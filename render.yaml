services:
  - type: web
    name: zendata-backend
    runtime: python
    plan: free
    rootDir: zendataproject/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: zendata-frontend
    runtime: node
    plan: free
    rootDir: zendataproject/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://zendata-backend.onrender.com
